---
name: projects-network-${ORG}
version: 1.0.0
client:
  organization: ${ORGNAME}
  connection:
    timeout:
      peer:
        endorser: '300'
organizations:
  ${ORGNAME}:
    mspid: ${MSPID}
    peers:
    - peer0.${ORG}.example.com
peers:
  peer0.${ORG}.example.com:
    url: grpcs://localhost:${P0PORT}
    tlsCACerts:
      pem: |
          ${PEERPEM}
    grpcOptions:
      ssl-target-name-override: peer0.${ORG}.example.com
      hostnameOverride: peer0.${ORG}.example.com
