# SPDX-License-Identifier: Apache-2.0
#
# Projects network: 1 Raft orderer + 2 organizations (Platform, AdminOrg) with 1 peer each.
# Derived from fabric-samples/test-network/compose/compose-test-net.yaml.
#
# Operations service (health + Prometheus metrics), plain HTTP, published to the host:
#   orderer.example.com            -> http://localhost:9443   (/healthz, /metrics)
#   peer0.platform.example.com     -> http://localhost:9444
#   peer0.adminorg.example.com     -> http://localhost:9445

name: ${PN_PROJECT:-fabricprojects}

# Everything the containers need from the sources / generated files comes from ONE named volume ("workspace"),
# created and filled by the pn launcher (see ../../orchestrator). Each service mounts only its own sub-folder,
# so no host paths are involved and it behaves the same on Windows, macOS and Linux.
volumes:
  workspace:
    name: ${PN_WORKSPACE_VOLUME:-fabricprojects_workspace}
    external: true
  orderer.example.com:
  peer0.platform.example.com:
  peer0.adminorg.example.com:

networks:
  projects:
    name: projects_net

services:

  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:${FABRIC_IMAGE_TAG:-3.1.5}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      # enabled TLS
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
      - type: volume
        source: workspace
        target: /var/hyperledger/orderer/msp
        read_only: true
        volume:
          subpath: project-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp
      - type: volume
        source: workspace
        target: /var/hyperledger/orderer/tls
        read_only: true
        volume:
          subpath: project-network/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls
      - orderer.example.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
      - 9443:9443
    networks:
      - projects

  peer0.platform.example.com:
    container_name: peer0.platform.example.com
    image: hyperledger/fabric-peer:${FABRIC_IMAGE_TAG:-3.1.5}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # Peer specific variables
      - CORE_PEER_ID=peer0.platform.example.com
      - CORE_PEER_ADDRESS=peer0.platform.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.platform.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.platform.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.platform.example.com:7051
      - CORE_PEER_LOCALMSPID=PlatformMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0platform"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - type: volume
        source: workspace
        target: /etc/hyperledger/fabric
        read_only: true
        volume:
          subpath: project-network/organizations/peerOrganizations/platform.example.com/peers/peer0.platform.example.com
      - peer0.platform.example.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 7051:7051
      - 9444:9444
    networks:
      - projects

  peer0.adminorg.example.com:
    container_name: peer0.adminorg.example.com
    image: hyperledger/fabric-peer:${FABRIC_IMAGE_TAG:-3.1.5}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # Peer specific variables
      - CORE_PEER_ID=peer0.adminorg.example.com
      - CORE_PEER_ADDRESS=peer0.adminorg.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.adminorg.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.adminorg.example.com:9051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.adminorg.example.com:9051
      - CORE_PEER_LOCALMSPID=AdminOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0adminorg"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - type: volume
        source: workspace
        target: /etc/hyperledger/fabric
        read_only: true
        volume:
          subpath: project-network/organizations/peerOrganizations/adminorg.example.com/peers/peer0.adminorg.example.com
      - peer0.adminorg.example.com:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - 9051:9051
      - 9445:9445
    networks:
      - projects
