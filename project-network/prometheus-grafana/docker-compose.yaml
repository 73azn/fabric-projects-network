# Prometheus + Grafana for the projects network. Start with ../start-monitoring.sh
#   Grafana:    http://localhost:3000   (login: admin / admin)
#   Prometheus: http://localhost:9090
name: ${PN_PROJECT:-fabricprojects}-monitoring

volumes:
  workspace:
    name: ${PN_WORKSPACE_VOLUME:-fabricprojects_workspace}
    external: true
  prometheus_data: {}
  grafana_storage: {}

services:
  prometheus:
    image: prom/prometheus:v2.32.1
    container_name: prometheus
    volumes:
      - type: volume
        source: workspace
        target: /etc/prometheus
        read_only: true
        volume:
          subpath: project-network/prometheus-grafana/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:8.3.4
    container_name: grafana
    user: "104"
    depends_on:
      - prometheus
    ports:
      - 3000:3000
    volumes:
      - grafana_storage:/var/lib/grafana
      - type: volume
        source: workspace
        target: /etc/grafana/provisioning
        read_only: true
        volume:
          subpath: project-network/prometheus-grafana/grafana/provisioning
    env_file:
      - ./grafana/config.monitoring
    restart: always

networks:
  default:
    external: true
    name: projects_net
